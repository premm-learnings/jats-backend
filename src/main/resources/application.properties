spring.application.name=jats-backend

# =====================================================================
# Database Configuration
# =====================================================================
# Automatically uses Railway's native database variable string, falling back to an internal connection if needed
spring.datasource.url=${SPRING_DATASOURCE_URL=${DATABASE_URL=jdbc:mysql://${DB_HOST=mysql.railway.internal}:${DB_PORT=3306}/${DB_NAME=railway}}}
spring.datasource.username=${DB_USER=root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA & Hibernate Configuration
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Explicitly sets the MySQL Dialect to instantly bypass JDBC metadata lookup errors
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect