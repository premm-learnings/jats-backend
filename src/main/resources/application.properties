spring.application.name=jats-backend

# =====================================================================
# Database Configuration (Foolproof Production URL)
# =====================================================================
# This grabs the complete URL from Railway and guarantees the jdbc: prefix
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER=${DB_USERNAME}}}
spring.datasource.password=${DB_PASSWORD=${DB_PASSWORD}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA & Hibernate Configuration
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect