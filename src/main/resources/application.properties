spring.application.name=jats-backend

# =====================================================================
# Database Configuration
# =====================================================================
# 1. Try to use the exact URL provided by Railway.
# 2. If it's missing the "jdbc:" prefix, Spring will fallback to building it via individual variables below.

# Credentials
spring.datasource.url=jdbc:mysql://${DB_HOST=mysql.railway.internal}:${DB_PORT=3306}/${DB_NAME=railway}
spring.datasource.username=${DB_USER=root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA & Hibernate Configuration
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
