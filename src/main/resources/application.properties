spring.application.name=jats-backend

# =====================================================================
# Database Configuration
# =====================================================================
# This forces the 'jdbc:' prefix before whatever string Railway injects
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL=${DATABASE_URL=mysql://${DB_HOST=mysql.railway.internal}:${DB_PORT=3306}/${DB_NAME=railway}}}
spring.datasource.username=${DB_USER=root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA & Hibernate Configuration
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Explicitly sets the MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect